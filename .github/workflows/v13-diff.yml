name: v13 differential

# Differential v12-vs-v13 BOM comparison over the golden scenario corpus.
# Runs nightly and on PRs labelled `v13` (not every push — it is slow because
# it installs and invokes a second cdxgen version).

on:
  schedule:
    # Nightly at 03:17 UTC — off the top of the hour to reduce load.
    - cron: '17 3 * * *'
  # No `paths:` filter here on purpose. A paths filter is ANDed with the event,
  # so labelling a PR that only touched lib/** would not have triggered this —
  # and that is the primary case we need it for (Deliverable 03 refactors
  # lib/helpers/utils.js). The `v13` label is the gate; the job-level `if:`
  # enforces it.
  pull_request:
    types: [labeled]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NEXUS_URL: ${{ secrets.NEXUS_URL }}

permissions: {}

jobs:
  diff-v12-v13:
    # Only run on: scheduled runs, manual dispatch, or PRs labelled `v13`.
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && contains(github.event.label.name, 'v13'))
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271  # v6.0.9
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: pnpm install
        run: pnpm install:frozen
      - name: Run v12-vs-v13 differential comparison
        run: node ci/diff-v12-v13.js
        env:
          CI: true
