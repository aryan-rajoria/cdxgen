name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Resolve dependency tree
        run: mvn -B dependency:tree -DoutputFile=/tmp/dependency-tree.txt
      - name: Build
        run: mvn -B package -DskipTests
